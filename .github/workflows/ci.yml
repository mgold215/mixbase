name: CI — Build, Lint, Security

on:
  push:
    branches: [main, tst]
  pull_request:
    branches: [main, tst]

# Opt the bundled JavaScript actions (checkout, setup-node, gitleaks) into the
# Node 24 runtime ahead of GitHub's 2026-06-16 Node 20 deprecation, WITHOUT
# bumping any action major versions (which could change gitleaks-action's
# license/config behaviour and break the required Secret Scanning check).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-lint:
    timeout-minutes: 20
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  renderer-tests:
    timeout-minutes: 25
    name: Renderer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: finalize-test / video-test import the real .ts renderer modules
      # directly and rely on Node's native TypeScript type-stripping, which is
      # default-on in Node 22+ but absent in Node 20 (ERR_UNKNOWN_FILE_EXTENSION).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Self-contained smoke tests that exercise the real JWT-verify, artwork
      # (sharp + opentype), and video (bundled ffmpeg) code paths with synthetic
      # inputs — no network or secrets. Kept out of the required Build & Lint
      # gate so an environment quirk can't block merges, but run on every push.
      - run: npm run test:renderers

  secret-scan:
    timeout-minutes: 15
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks scans for passwords, API keys, tokens in the codebase
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    timeout-minutes: 10
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # REAL gate: anything that actually ships and touches user data.
      # This previously carried `continue-on-error: true`, so despite the
      # "fail on high" comment the job could never fail — and it stayed green
      # while sharp shipped 4 HIGH libvips CVEs on the path that decodes
      # user-uploaded artwork. Runtime deps are clean; keep them that way.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # Advisory only: build/test tooling never reaches production, and the
      # eslint chain currently pins a transitive brace-expansion advisory whose
      # fix (v5) breaks minimatch. Visible in the log, non-blocking.
      - name: Audit dev tooling (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
