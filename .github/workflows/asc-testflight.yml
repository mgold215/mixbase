# TestFlight tester invites, driven by a file instead of a button — same
# pattern as asc-cert-audit.yml: remote maintenance sessions cannot dispatch
# workflows (403) or log into App Store Connect, but they can push, so editing
# .github/asc-maintenance/testflight-request.json and pushing runs this.
# The script is idempotent (testers already in the group are skipped), so a
# stray push re-sends nothing.

name: ASC TestFlight Invites

on:
  push:
    branches: [main, tst]
    paths:
      - '.github/asc-maintenance/testflight-request.json'
      - '.github/asc-maintenance/asc-testflight.mjs'
      - '.github/workflows/asc-testflight.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: asc-testflight
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  invite:
    name: TestFlight tester invites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run testflight-request.json against the ASC API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node .github/asc-maintenance/asc-testflight.mjs
