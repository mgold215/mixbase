# TestFlight external-testing upkeep, driven by a file instead of a button —
# same pattern as asc-cert-audit.yml: remote maintenance sessions cannot
# dispatch workflows (403) or log into App Store Connect, but they can push,
# so editing .github/asc-maintenance/testflight-request.json and pushing runs
# this. It also re-runs after every "iOS TestFlight" upload, because external
# beta groups do not pick up new builds by themselves — without this, public-
# link testers would be stranded on the first build forever. The script is
# idempotent, so extra runs change nothing.

name: ASC TestFlight Invites

on:
  push:
    branches: [main, tst]
    paths:
      - '.github/asc-maintenance/testflight-request.json'
      - '.github/asc-maintenance/asc-testflight.mjs'
      - '.github/workflows/asc-testflight.yml'
  workflow_run:
    workflows: ["iOS TestFlight"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: asc-testflight
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  invite:
    name: TestFlight external-testing upkeep
    runs-on: ubuntu-latest
    # The script can wait up to 30 min for a just-uploaded build to finish
    # TestFlight processing (workflow_run fires right after upload).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run testflight-request.json against the ASC API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node .github/asc-maintenance/asc-testflight.mjs
