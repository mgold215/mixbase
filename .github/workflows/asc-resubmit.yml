# re-run 2026-09-16 (2): + does the API expose the demo account password to a runner?
# TEMP (branch asc5-inspect only): read-only App Store state dump.
#
# Same push-driven pattern as previous asc-* TEMP branches — remote sessions
# cannot workflow_dispatch (403), but a push to this branch runs it. Read-only.

name: App Store Resubmit

on:
  push:
    branches: [asc5-inspect]
  workflow_dispatch: {}

concurrency:
  group: asc-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    name: Resubmit to App Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      BUNDLE_ID: com.moodmixformat.mixbase
    steps:
      - name: Dump listing metadata, screenshots and builds
        run: |
          cat > /tmp/inspect.mjs <<'EOF'
          import crypto from 'node:crypto'

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64, BUNDLE_ID } = process.env
          const BASE = 'https://api.appstoreconnect.apple.com'

          const b64url = (buf) => Buffer.from(buf).toString('base64url')
          function jwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }))
            const now = Math.floor(Date.now() / 1000)
            const payload = b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }))
            const key = Buffer.from(ASC_API_KEY_P8_BASE64, 'base64').toString('utf8')
            const sig = crypto.sign('sha256', Buffer.from(`${header}.${payload}`), { key, dsaEncoding: 'ieee-p1363' })
            return `${header}.${payload}.${b64url(sig)}`
          }
          const TOKEN = jwt()
          async function api(method, path, body) {
            const res = await fetch(`${BASE}${path}`, {
              method,
              headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            })
            const text = await res.text()
            let json = null
            try { json = JSON.parse(text) } catch { /* non-JSON */ }
            return { status: res.status, ok: res.ok, json, text }
          }
          const show = (v) => JSON.stringify(v)

          const apps = await api('GET', `/v1/apps?filter[bundleId]=${BUNDLE_ID}`)
          const app = apps.json?.data?.[0]
          if (!app) { console.log('find app FAILED', apps.status, apps.text.slice(0, 500)); process.exit(1) }
          console.log(`App: ${app.attributes.name} (${app.id})`)

          // ── App info (name / subtitle / categories) ─────────────────────
          const infos = await api('GET', `/v1/apps/${app.id}/appInfos?include=primaryCategory,secondaryCategory&limit=5`)
          for (const info of infos.json?.data ?? []) {
            console.log(`\n== appInfo ${info.id}: state=${info.attributes.state ?? info.attributes.appStoreState} primary=${info.relationships?.primaryCategory?.data?.id} secondary=${info.relationships?.secondaryCategory?.data?.id} kidsAge=${info.attributes.kidsAgeBand}`)
            const locs = await api('GET', `/v1/appInfos/${info.id}/appInfoLocalizations?limit=10`)
            for (const l of locs.json?.data ?? []) {
              const a = l.attributes
              console.log(`   [${a.locale}] name=${show(a.name)} subtitle=${show(a.subtitle)} privacyPolicyUrl=${show(a.privacyPolicyUrl)} privacyChoicesUrl=${show(a.privacyChoicesUrl)}`)
            }
          }

          // ── Versions (both platforms) + localizations + screenshot sets ─
          for (const platform of ['IOS', 'MAC_OS']) {
            const vers = await api('GET', `/v1/apps/${app.id}/appStoreVersions?filter[platform]=${platform}&limit=5`)
            console.log(`\n\n######## ${platform}: ${(vers.json?.data ?? []).length} versions (HTTP ${vers.status})`)
            for (const v of vers.json?.data ?? []) {
              const a = v.attributes
              console.log(`\n== version ${a.versionString} (${v.id}) state=${a.appVersionState ?? a.appStoreState} releaseType=${a.releaseType} created=${a.createdDate} copyright=${show(a.copyright)}`)
              const build = await api('GET', `/v1/appStoreVersions/${v.id}/build?fields[builds]=version,uploadedDate,processingState`)
              console.log(`   build: ${build.json?.data ? `${build.json.data.attributes.version} uploaded ${build.json.data.attributes.uploadedDate}` : `none (HTTP ${build.status})`}`)
              const locs = await api('GET', `/v1/appStoreVersions/${v.id}/appStoreVersionLocalizations?limit=10`)
              for (const l of locs.json?.data ?? []) {
                const la = l.attributes
                console.log(`\n   --- localization ${la.locale} (${l.id})`)
                console.log(`   promotionalText: ${show(la.promotionalText)}`)
                console.log(`   keywords: ${show(la.keywords)}`)
                console.log(`   supportUrl: ${show(la.supportUrl)} marketingUrl: ${show(la.marketingUrl)}`)
                console.log(`   whatsNew: ${show(la.whatsNew)}`)
                console.log(`   description (${(la.description ?? '').length} chars):\n${la.description ?? ''}\n   --- end description`)
                const sets = await api('GET', `/v1/appStoreVersionLocalizations/${l.id}/appScreenshotSets?include=appScreenshots&limit=20`)
                const shotsById = new Map((sets.json?.included ?? []).filter((i) => i.type === 'appScreenshots').map((i) => [i.id, i]))
                console.log(`   screenshot sets: ${(sets.json?.data ?? []).length} (HTTP ${sets.status})`)
                for (const s of sets.json?.data ?? []) {
                  const ids = (s.relationships?.appScreenshots?.data ?? []).map((d) => d.id)
                  console.log(`     set ${s.attributes.screenshotDisplayType} (${s.id}): ${ids.length} screenshots`)
                  for (const id of ids) {
                    const sc = shotsById.get(id)
                    if (!sc) { console.log(`       ${id}: (not included)`); continue }
                    const sa = sc.attributes
                    console.log(`       ${sa.fileName} ${sa.imageAsset?.width}x${sa.imageAsset?.height} ${sa.fileSize}B state=${sa.assetDeliveryState?.state} url=${(sa.imageAsset?.templateUrl ?? '').replace('{w}', String(sa.imageAsset?.width ?? 0)).replace('{h}', String(sa.imageAsset?.height ?? 0)).replace('{f}', 'png')}`)
                  }
                }
                const prev = await api('GET', `/v1/appStoreVersionLocalizations/${l.id}/appPreviewSets?include=appPreviews&limit=20`)
                console.log(`   preview (video) sets: ${(prev.json?.data ?? []).length} (HTTP ${prev.status})`)
                for (const p of prev.json?.data ?? []) console.log(`     ${p.attributes.previewType}: ${(p.relationships?.appPreviews?.data ?? []).length} previews`)
              }
            }
          }

          // ── Builds (newest first, both platforms) ───────────────────────
          for (const platform of ['IOS', 'MAC_OS']) {
            const builds = await api('GET', `/v1/builds?filter[app]=${app.id}&filter[preReleaseVersion.platform]=${platform}&sort=-uploadedDate&limit=8&fields[builds]=version,uploadedDate,processingState,expired,minOsVersion&include=preReleaseVersion&fields[preReleaseVersions]=version,platform`)
            const pre = new Map((builds.json?.included ?? []).map((i) => [i.id, i.attributes.version]))
            console.log(`\n== ${platform} builds (HTTP ${builds.status}):`)
            for (const b of builds.json?.data ?? []) {
              const a = b.attributes
              console.log(`   ${pre.get(b.relationships?.preReleaseVersion?.data?.id) ?? '?'} (${a.version}) uploaded=${a.uploadedDate} state=${a.processingState} expired=${a.expired} minOS=${a.minOsVersion}`)
            }
          }

          // ── Review details: can a runner read the demo login? (password masked)
          const iosVers = await api('GET', `/v1/apps/${app.id}/appStoreVersions?filter[platform]=IOS&limit=1`)
          const vid = iosVers.json?.data?.[0]?.id
          if (vid) {
            const rd = await api('GET', `/v1/appStoreVersions/${vid}/appStoreReviewDetail`)
            const a = rd.json?.data?.attributes ?? {}
            console.log(`\nreviewDetail HTTP ${rd.status}: id=${rd.json?.data?.id} demoAccountRequired=${a.demoAccountRequired} demoAccountName=${JSON.stringify(a.demoAccountName)} demoAccountPassword=${a.demoAccountPassword ? `<present, ${a.demoAccountPassword.length} chars>` : JSON.stringify(a.demoAccountPassword)} contact=${a.contactFirstName} ${a.contactLastName} notesLen=${(a.notes ?? '').length}`)
            if (!rd.ok) console.log(rd.text.slice(0, 800))
          }
          console.log('\nRead-only inspection complete. No changes made.')
          EOF
          node /tmp/inspect.mjs
