# Resubmit the app to App Store Review — no Mac, no new binary.
#
# Runs on demand (workflow_dispatch). Talks to the App Store Connect Review
# Submissions API with the same API key the TestFlight workflow uses. Two modes:
#   inspect  print the app's review submissions + version states, change nothing
#   submit   resubmit the open (rejected/draft) submission, or create a fresh
#            one for the newest submittable version, then submit it
#
# Exists because server-side fixes (like the Supabase Apple-audience config)
# don't need a new build — the same rejected binary can go straight back to
# review. The runner has the ASC key (repo secrets) and open egress; agent
# sandboxes have neither.

name: App Store Resubmit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect (read-only) or submit'
        required: false
        default: 'submit'

concurrency:
  group: asc-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    name: Resubmit to App Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      MODE: ${{ inputs.mode || 'submit' }}
      BUNDLE_ID: com.moodmixformat.mixbase
    steps:
      - name: Drive the Review Submissions API
        run: |
          cat > /tmp/resubmit.mjs <<'EOF'
          import crypto from 'node:crypto'

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64, MODE, BUNDLE_ID } = process.env
          const BASE = 'https://api.appstoreconnect.apple.com/v1'

          const b64url = (buf) => Buffer.from(buf).toString('base64url')
          function jwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }))
            const now = Math.floor(Date.now() / 1000)
            const payload = b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }))
            const key = Buffer.from(ASC_API_KEY_P8_BASE64, 'base64').toString('utf8')
            const sig = crypto.sign('sha256', Buffer.from(`${header}.${payload}`), { key, dsaEncoding: 'ieee-p1363' })
            return `${header}.${payload}.${b64url(sig)}`
          }

          const TOKEN = jwt()
          async function api(method, path, body) {
            const res = await fetch(`${BASE}${path}`, {
              method,
              headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            })
            const text = await res.text()
            let json = null
            try { json = JSON.parse(text) } catch { /* non-JSON error body */ }
            return { status: res.status, ok: res.ok, json, text }
          }
          function must(r, what) {
            if (!r.ok) {
              console.error(`FAILED: ${what} -> HTTP ${r.status}`)
              console.error(JSON.stringify(r.json ?? r.text, null, 2))
              process.exit(1)
            }
            return r.json
          }

          // ── App ────────────────────────────────────────────────────────────
          const apps = must(await api('GET', `/apps?filter[bundleId]=${BUNDLE_ID}`), 'find app')
          const app = apps.data?.[0]
          if (!app) { console.error(`No app found for bundle ID ${BUNDLE_ID}`); process.exit(1) }
          console.log(`App: ${app.attributes.name} (${app.id})`)

          // ── Current review submissions ─────────────────────────────────────
          const subs = must(
            await api('GET', `/reviewSubmissions?filter[app]=${app.id}&filter[platform]=IOS&limit=20`),
            'list review submissions'
          )
          for (const s of subs.data ?? []) {
            console.log(`Submission ${s.id}: state=${s.attributes.state} submitted=${s.attributes.submittedDate ?? 'never'}`)
          }

          // ── Recent versions (for visibility, and for the create path) ──────
          const vers = must(
            await api('GET', `/apps/${app.id}/appStoreVersions?filter[platform]=IOS&limit=10`),
            'list appStoreVersions'
          )
          const versions = (vers.data ?? []).sort(
            (a, b) => new Date(b.attributes.createdDate) - new Date(a.attributes.createdDate)
          )
          for (const v of versions) {
            const state = v.attributes.appVersionState ?? v.attributes.appStoreState
            console.log(`Version ${v.attributes.versionString} (${v.id}): state=${state} created=${v.attributes.createdDate}`)
          }

          if (MODE === 'inspect') { console.log('Mode=inspect — no changes made.'); process.exit(0) }

          // ── Submit ─────────────────────────────────────────────────────────
          const queued = (subs.data ?? []).find(s => ['WAITING_FOR_REVIEW', 'IN_REVIEW'].includes(s.attributes.state))
          if (queued) {
            console.log(`Already queued: submission ${queued.id} is ${queued.attributes.state}. Nothing to do.`)
            process.exit(0)
          }

          let submission = (subs.data ?? []).find(s => ['UNRESOLVED_ISSUES', 'READY_FOR_REVIEW'].includes(s.attributes.state))

          if (!submission) {
            // No open submission — build one around the newest submittable version.
            const SUBMITTABLE = ['REJECTED', 'METADATA_REJECTED', 'DEVELOPER_REJECTED', 'INVALID_BINARY', 'PREPARE_FOR_SUBMISSION']
            const candidate = versions.find(v => SUBMITTABLE.includes(v.attributes.appVersionState ?? v.attributes.appStoreState))
            if (!candidate) { console.error('No open submission and no version in a submittable state — nothing to resubmit.'); process.exit(1) }
            console.log(`Creating a new review submission for version ${candidate.attributes.versionString}...`)
            const created = must(await api('POST', '/reviewSubmissions', {
              data: {
                type: 'reviewSubmissions',
                attributes: { platform: 'IOS' },
                relationships: { app: { data: { type: 'apps', id: app.id } } },
              },
            }), 'create review submission')
            submission = created.data
            must(await api('POST', '/reviewSubmissionItems', {
              data: {
                type: 'reviewSubmissionItems',
                relationships: {
                  reviewSubmission: { data: { type: 'reviewSubmissions', id: submission.id } },
                  appStoreVersion: { data: { type: 'appStoreVersions', id: candidate.id } },
                },
              },
            }), 'attach version to submission')
          } else {
            console.log(`Reusing open submission ${submission.id} (state=${submission.attributes.state})`)
          }

          const done = must(await api('PATCH', `/reviewSubmissions/${submission.id}`, {
            data: { type: 'reviewSubmissions', id: submission.id, attributes: { submitted: true } },
          }), 'submit for review')
          console.log(`RESUBMITTED: submission ${done.data.id} is now ${done.data.attributes.state}`)
          EOF
          node /tmp/resubmit.mjs
