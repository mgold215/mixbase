# TEMP (branch asc5-inspect only): read-only App Store review state dump.
#
# Same push-driven pattern as previous asc-* TEMP branches — remote sessions
# cannot workflow_dispatch (403), but a push to this branch runs it. Read-only:
# prints review submissions, version states, and the Resolution Center threads
# and messages (the actual rejection text from App Review). Changes nothing.

name: App Store Resubmit

on:
  push:
    branches: [asc5-inspect]
  workflow_dispatch: {}

concurrency:
  group: asc-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    name: Resubmit to App Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      BUNDLE_ID: com.moodmixformat.mixbase
    steps:
      - name: Dump review state + resolution center
        run: |
          cat > /tmp/inspect.mjs <<'EOF'
          import crypto from 'node:crypto'

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64, BUNDLE_ID } = process.env
          const BASE = 'https://api.appstoreconnect.apple.com/v1'

          const b64url = (buf) => Buffer.from(buf).toString('base64url')
          function jwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }))
            const now = Math.floor(Date.now() / 1000)
            const payload = b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }))
            const key = Buffer.from(ASC_API_KEY_P8_BASE64, 'base64').toString('utf8')
            const sig = crypto.sign('sha256', Buffer.from(`${header}.${payload}`), { key, dsaEncoding: 'ieee-p1363' })
            return `${header}.${payload}.${b64url(sig)}`
          }

          const TOKEN = jwt()
          async function api(method, path, body) {
            const res = await fetch(`${BASE}${path}`, {
              method,
              headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            })
            const text = await res.text()
            let json = null
            try { json = JSON.parse(text) } catch { /* non-JSON */ }
            return { status: res.status, ok: res.ok, json, text }
          }
          function dump(label, r, cap = 24000) {
            console.log(`\n===== ${label} -> HTTP ${r.status} =====`)
            const body = r.json ? JSON.stringify(r.json, null, 2) : r.text
            console.log(body.length > cap ? body.slice(0, cap) + `\n...[truncated ${body.length - cap} chars]` : body)
            return r
          }

          // App
          const apps = await api('GET', `/apps?filter[bundleId]=${BUNDLE_ID}`)
          const app = apps.json?.data?.[0]
          if (!app) { dump('find app FAILED', apps); process.exit(1) }
          console.log(`App: ${app.attributes.name} (${app.id})`)

          // Review submissions — newest first
          const subs = await api('GET', `/reviewSubmissions?filter[app]=${app.id}&limit=20`)
          const subList = (subs.json?.data ?? []).sort(
            (a, b) => new Date(b.attributes.submittedDate ?? 0) - new Date(a.attributes.submittedDate ?? 0)
          )
          for (const s of subList) {
            console.log(`Submission ${s.id}: platform=${s.attributes.platform} state=${s.attributes.state} submitted=${s.attributes.submittedDate ?? 'never'}`)
          }

          // Versions (both platforms)
          const vers = await api('GET', `/apps/${app.id}/appStoreVersions?limit=20`)
          for (const v of vers.json?.data ?? []) {
            const state = v.attributes.appVersionState ?? v.attributes.appStoreState
            console.log(`Version ${v.attributes.versionString} platform=${v.attributes.platform} (${v.id}): state=${state} created=${v.attributes.createdDate}`)
          }

          // Items of the newest few submissions
          for (const s of subList.slice(0, 4)) {
            dump(`items of submission ${s.id} (${s.attributes.state})`,
              await api('GET', `/reviewSubmissions/${s.id}/items`))
          }

          // Resolution Center — try the plausible endpoint shapes; failures are
          // informative (the error names the required filter), not fatal.
          const threadIds = new Set()
          const collect = (r) => {
            for (const t of r.json?.data ?? []) if (t.type === 'resolutionCenterThreads') threadIds.add(t.id)
          }
          collect(dump('threads by app filter', await api('GET', `/resolutionCenterThreads?filter[app]=${app.id}&limit=20`)))
          for (const s of subList.slice(0, 4)) {
            collect(dump(`threads by reviewSubmission ${s.id}`,
              await api('GET', `/resolutionCenterThreads?filter[reviewSubmission]=${s.id}&limit=20`)))
          }

          for (const tid of threadIds) {
            const viaSub = await api('GET', `/resolutionCenterThreads/${tid}/resolutionCenterMessages?limit=50`)
            dump(`messages of thread ${tid} (subresource)`, viaSub)
            if (!viaSub.ok) {
              dump(`messages of thread ${tid} (filter)`,
                await api('GET', `/resolutionCenterMessages?filter[resolutionCenterThread]=${tid}&limit=50`))
            }
            dump(`messages of thread ${tid} with rejections`,
              await api('GET', `/resolutionCenterThreads/${tid}/resolutionCenterMessages?limit=50&include=rejections,fromActor`), 40000)
          }
          console.log('\nRead-only inspection complete. No changes made.')
          EOF
          node /tmp/inspect.mjs
