# Resubmit the app to App Store Review — no Mac, no new binary.
#
# Runs on demand (workflow_dispatch). Talks to the App Store Connect Review
# Submissions API with the same API key the TestFlight workflow uses. Two modes:
#   inspect  print the app's review submissions + version states, change nothing
#   submit   resubmit the open (rejected/draft) submission, or create a fresh
#            one for the newest submittable version, then submit it
#
# Exists because server-side fixes (like the Supabase Apple-audience config)
# don't need a new build — the same rejected binary can go straight back to
# review. The runner has the ASC key (repo secrets) and open egress; agent
# sandboxes have neither.

name: App Store Resubmit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect (read-only) or submit'
        required: false
        default: 'submit'
  # TEMPORARY (user-approved, trigger-branch only — revoked after use): the
  # remote session's GitHub integration cannot call the workflow-dispatch API,
  # but push events run the workflow file at the pushed ref. asc-inspect fires
  # read-only mode; any other listed ref fires a real resubmission.
  push:
    branches: [asc-inspect, asc-submit, asc3-submit]

concurrency:
  group: asc-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    name: Resubmit to App Review
    runs-on: ubuntu-latest
    # Long enough to wait out TestFlight build processing before attaching.
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      MODE: ${{ inputs.mode || (github.ref_name == 'asc-inspect' && 'inspect') || 'submit' }}
      BUNDLE_ID: com.moodmixformat.mixbase
    steps:
      - name: Drive the Review Submissions API
        run: |
          cat > /tmp/resubmit.mjs <<'EOF'
          import crypto from 'node:crypto'

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64, MODE, BUNDLE_ID } = process.env
          const BASE = 'https://api.appstoreconnect.apple.com/v1'

          const b64url = (buf) => Buffer.from(buf).toString('base64url')
          function jwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }))
            const now = Math.floor(Date.now() / 1000)
            const payload = b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }))
            const key = Buffer.from(ASC_API_KEY_P8_BASE64, 'base64').toString('utf8')
            const sig = crypto.sign('sha256', Buffer.from(`${header}.${payload}`), { key, dsaEncoding: 'ieee-p1363' })
            return `${header}.${payload}.${b64url(sig)}`
          }

          const TOKEN = jwt()
          async function api(method, path, body) {
            const res = await fetch(`${BASE}${path}`, {
              method,
              headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            })
            const text = await res.text()
            let json = null
            try { json = JSON.parse(text) } catch { /* non-JSON error body */ }
            return { status: res.status, ok: res.ok, json, text }
          }
          function must(r, what) {
            if (!r.ok) {
              console.error(`FAILED: ${what} -> HTTP ${r.status}`)
              console.error(JSON.stringify(r.json ?? r.text, null, 2))
              process.exit(1)
            }
            return r.json
          }

          // ── App ────────────────────────────────────────────────────────────
          const apps = must(await api('GET', `/apps?filter[bundleId]=${BUNDLE_ID}`), 'find app')
          const app = apps.data?.[0]
          if (!app) { console.error(`No app found for bundle ID ${BUNDLE_ID}`); process.exit(1) }
          console.log(`App: ${app.attributes.name} (${app.id})`)

          // ── Current review submissions ─────────────────────────────────────
          const subs = must(
            await api('GET', `/reviewSubmissions?filter[app]=${app.id}&filter[platform]=IOS&limit=20`),
            'list review submissions'
          )
          for (const s of subs.data ?? []) {
            console.log(`Submission ${s.id}: state=${s.attributes.state} submitted=${s.attributes.submittedDate ?? 'never'}`)
          }

          // ── Recent versions (for visibility, and for the create path) ──────
          const vers = must(
            await api('GET', `/apps/${app.id}/appStoreVersions?filter[platform]=IOS&limit=10`),
            'list appStoreVersions'
          )
          const versions = (vers.data ?? []).sort(
            (a, b) => new Date(b.attributes.createdDate) - new Date(a.attributes.createdDate)
          )
          for (const v of versions) {
            const state = v.attributes.appVersionState ?? v.attributes.appStoreState
            console.log(`Version ${v.attributes.versionString} (${v.id}): state=${state} created=${v.attributes.createdDate}`)
          }

          if (MODE === 'inspect') { console.log('Mode=inspect — no changes made.'); process.exit(0) }

          // ── Submit ─────────────────────────────────────────────────────────
          const queued = (subs.data ?? []).find(s => ['WAITING_FOR_REVIEW', 'IN_REVIEW'].includes(s.attributes.state))
          if (queued) {
            console.log(`Already queued: submission ${queued.id} is ${queued.attributes.state}. Nothing to do.`)
            process.exit(0)
          }

          const vid = versions[0]?.id
          if (!vid) { console.error('No appStoreVersion found.'); process.exit(1) }

          // 1. Wait for the newest processed build and attach it to the version.
          //    The 3.1.1/1.2 fixes only exist in the new binary — resubmitting
          //    the old build would be an instant third rejection.
          const attachedRes = await api('GET', `/appStoreVersions/${vid}/build?fields[builds]=version,uploadedDate`)
          const attached = attachedRes.json?.data ?? null
          console.log(`Currently attached build: ${attached ? attached.attributes.version : 'none'}`)
          let newest = null
          for (let i = 0; i < 30; i++) {   // up to ~25 min for upload+processing
            const bs = must(await api('GET', `/builds?filter[app]=${app.id}&sort=-uploadedDate&limit=1&fields[builds]=version,processingState,expired,uploadedDate`), 'list builds')
            const b = bs.data?.[0]
            if (b && !b.attributes.expired && b.attributes.processingState === 'VALID') { newest = b; break }
            console.log(`Waiting for a VALID build (newest: ${b ? `${b.attributes.version}/${b.attributes.processingState}` : 'none'})...`)
            await new Promise(r => setTimeout(r, 50_000))
          }
          if (!newest) { console.error('No VALID build appeared — aborting before touching the submission.'); process.exit(1) }
          if (attached && newest.id === attached.id) {
            console.log(`Newest VALID build ${newest.attributes.version} is already attached — continuing`)
          } else {
            must(await api('PATCH', `/appStoreVersions/${vid}/relationships/build`, {
              data: { type: 'builds', id: newest.id },
            }), 'attach new build to version')
            console.log(`Attached build ${newest.attributes.version} (${newest.id}) to the version`)
          }

          // 2. Refresh the App Review notes: no tier/plan mentions, disclose
          //    the UGC moderation, and answer the 3.1.1 rejection directly.
          const NOTES = [
            'mixBase is a music production tool for managing mix versions and releases.',
            '',
            'Getting started: sign in with the demo account (see App Review credentials). It is pre-loaded with 3 released tracks with cover art and playable audio. Tap a project to see its mix versions and play them; the Player tab has full playback with a queue.',
            '',
            'Regarding Guideline 3.1.1 (previous rejection): this build removes all access to and references of paid functionality. Every feature in the app is available on a free account: uploads, playback, sharing, the community feed, the release pipeline, and AI artwork generation (included with every free account, subject to a monthly quota). The app contains no purchase flows, no upgrade prompts, no pricing, and no links to external purchase pages. Visualizer video generation was removed from the app entirely.',
            '',
            'Community feed (user-generated content, Guideline 1.2): long-press any feed track or comment to Report it or Block its author. Reported content is hidden for the reporter immediately, reviewed within 24 hours, and removed for everyone past a report threshold. Our Terms of Service prohibit objectionable content.',
            '',
            'Account deletion (Guideline 5.1.1(v)): Settings tab -> Delete Account (type DELETE to confirm) permanently deletes the account and all data. Test with a throwaway account via "Create one" on the sign-in screen.',
            '',
            'The app requires an internet connection. There are no in-app purchases; the app is free.',
          ].join('\n')
          const rd = await api('GET', `/appStoreVersions/${vid}/appStoreReviewDetail`)
          if (rd.ok && rd.json?.data?.id) {
            const patched = await api('PATCH', `/appStoreReviewDetails/${rd.json.data.id}`, {
              data: { type: 'appStoreReviewDetails', id: rd.json.data.id, attributes: { notes: NOTES } },
            })
            console.log(`Review notes update: HTTP ${patched.status}`)
            if (!patched.ok) console.error(JSON.stringify(patched.json ?? patched.text).slice(0, 400))
          } else {
            console.log('No appStoreReviewDetail found — skipping notes update')
          }

          // 3. Fix the listing description (claims features the app lacks —
          //    Guideline 2.3.1). Non-fatal if it can't be edited right now.
          const DESCRIPTION = [
            'mixBase is the version tracker built for music producers. Upload mixes, listen back to every version, collect feedback, and manage your release pipeline - all in one place.',
            '',
            "Whether you're bouncing rough demos or polishing a final master, mixBase keeps every version organized so nothing gets lost.",
            '',
            'KEY FEATURES',
            '',
            '- Upload and organize mix versions for every project',
            '- Listen to any version of any track with a full-featured audio player',
            '- Track project status from rough idea to released',
            '- Share private listening links and collect feedback from collaborators',
            '- Hear what other artists are working on in the community feed',
            '- Manage your release pipeline with checklists for mastering, artwork, DSP submission, and more',
            '- Organize tracks into albums, EPs, and playlists',
            '- Generate AI-powered artwork concepts for your releases',
            '- Dark interface designed for studio environments',
            '',
            'mixBase is free to use. Create an account and start tracking your music today.',
          ].join('\n')
          const locs = await api('GET', `/appStoreVersions/${vid}/appStoreVersionLocalizations`)
          const enUS = (locs.json?.data ?? []).find(l => (l.attributes.locale ?? '').startsWith('en'))
          if (enUS) {
            const patched = await api('PATCH', `/appStoreVersionLocalizations/${enUS.id}`, {
              data: { type: 'appStoreVersionLocalizations', id: enUS.id, attributes: { description: DESCRIPTION } },
            })
            console.log(`Description update (${enUS.attributes.locale}): HTTP ${patched.status}`)
            if (!patched.ok) console.error(JSON.stringify(patched.json ?? patched.text).slice(0, 400))
          }

          // 4. A rejected (UNRESOLVED_ISSUES) submission is immutable through
          //    this API — cancel it to release the version, then go back to
          //    review through a draft (or fresh) submission.
          const rejectedSub = (subs.data ?? []).find(s => s.attributes.state === 'UNRESOLVED_ISSUES')
          if (rejectedSub) {
            const cancel = await api('PATCH', `/reviewSubmissions/${rejectedSub.id}`, {
              data: { type: 'reviewSubmissions', id: rejectedSub.id, attributes: { canceled: true } },
            })
            console.log(`Canceled rejected submission ${rejectedSub.id}: HTTP ${cancel.status}`)
            if (!cancel.ok) console.error(JSON.stringify(cancel.json ?? cancel.text).slice(0, 400))
          }

          // 5. Submit via the draft that holds the version (or attach it).
          const drafts = (subs.data ?? []).filter(s => s.attributes.state === 'READY_FOR_REVIEW')
          let submission = null
          let hasItem = false
          for (const d of drafts) {
            const di = await api('GET', `/reviewSubmissions/${d.id}/items`)
            const n = (di.json?.data ?? []).length
            console.log(`Draft ${d.id}: ${n} item(s)`)
            if (n > 0 && !submission) { submission = d; hasItem = true }
          }
          if (!submission) submission = drafts[0] ?? null
          if (!submission) {
            console.log('No draft available — creating a new review submission...')
            const created = must(await api('POST', '/reviewSubmissions', {
              data: {
                type: 'reviewSubmissions',
                attributes: { platform: 'IOS' },
                relationships: { app: { data: { type: 'apps', id: app.id } } },
              },
            }), 'create review submission')
            submission = created.data
          }
          console.log(`Submitting via ${submission.id}${hasItem ? ' (already contains the version item)' : ''}`)
          if (!hasItem) {
            // A just-canceled submission takes a short while to release its
            // version (ITEM_PART_OF_ANOTHER_SUBMISSION) — retry with a wait.
            let attachedItem = false
            for (let i = 0; i < 8 && !attachedItem; i++) {
              const add = await api('POST', '/reviewSubmissionItems', {
                data: {
                  type: 'reviewSubmissionItems',
                  relationships: {
                    reviewSubmission: { data: { type: 'reviewSubmissions', id: submission.id } },
                    appStoreVersion: { data: { type: 'appStoreVersions', id: vid } },
                  },
                },
              })
              console.log(`Attach version to submission (attempt ${i + 1}): HTTP ${add.status}`)
              if (add.ok) { attachedItem = true; break }
              const body = JSON.stringify(add.json ?? add.text)
              if (body.includes('ITEM_PART_OF_ANOTHER_SUBMISSION')) {
                await new Promise(r => setTimeout(r, 15_000))
                continue
              }
              console.error(body.slice(0, 500))
              break
            }
            if (!attachedItem) { console.error('Could not attach the version to the submission.'); process.exit(1) }
          }

          const done = must(await api('PATCH', `/reviewSubmissions/${submission.id}`, {
            data: { type: 'reviewSubmissions', id: submission.id, attributes: { submitted: true } },
          }), 'submit for review')
          console.log(`RESUBMITTED: submission ${done.data.id} is now ${done.data.attributes.state}`)
          EOF
          node /tmp/resubmit.mjs
