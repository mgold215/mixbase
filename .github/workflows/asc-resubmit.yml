# re-run 2026-09-15 (3): confirm territories moved from PROCESSING_TO_AVAILABLE to AVAILABLE
# re-run 2026-09-15 (2): availability + price after 'App Not Available in your country'
# re-run 2026-09-11: state after the 2.1(b) information request
# TEMP (branch asc5-inspect only): read-only App Store review state dump.
#
# Same push-driven pattern as previous asc-* TEMP branches — remote sessions
# cannot workflow_dispatch (403), but a push to this branch runs it. Read-only:
# prints review submissions, version states, and the Resolution Center threads
# and messages (the actual rejection text from App Review). Changes nothing.

name: App Store Resubmit

on:
  push:
    branches: [asc5-inspect]
  workflow_dispatch: {}

concurrency:
  group: asc-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    name: Resubmit to App Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      BUNDLE_ID: com.moodmixformat.mixbase
    steps:
      - name: Dump review state + resolution center
        run: |
          cat > /tmp/inspect.mjs <<'EOF'
          import crypto from 'node:crypto'

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64, BUNDLE_ID } = process.env
          const BASE = 'https://api.appstoreconnect.apple.com'

          const b64url = (buf) => Buffer.from(buf).toString('base64url')
          function jwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }))
            const now = Math.floor(Date.now() / 1000)
            const payload = b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }))
            const key = Buffer.from(ASC_API_KEY_P8_BASE64, 'base64').toString('utf8')
            const sig = crypto.sign('sha256', Buffer.from(`${header}.${payload}`), { key, dsaEncoding: 'ieee-p1363' })
            return `${header}.${payload}.${b64url(sig)}`
          }
          const TOKEN = jwt()
          async function api(method, path, body) {
            const res = await fetch(`${BASE}${path}`, {
              method,
              headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            })
            const text = await res.text()
            let json = null
            try { json = JSON.parse(text) } catch { /* non-JSON */ }
            return { status: res.status, ok: res.ok, json, text }
          }
          function dump(label, r, cap = 6000) {
            console.log(`\n===== ${label} -> HTTP ${r.status} =====`)
            const body = r.json ? JSON.stringify(r.json, null, 2) : r.text
            console.log(body.length > cap ? body.slice(0, cap) + `\n...[truncated ${body.length - cap} chars]` : body)
            return r
          }

          const apps = await api('GET', `/v1/apps?filter[bundleId]=${BUNDLE_ID}`)
          const app = apps.json?.data?.[0]
          if (!app) { dump('find app FAILED', apps); process.exit(1) }
          console.log(`App: ${app.attributes.name} (${app.id}) ${JSON.stringify(app.attributes)}`)

          const vers = await api('GET', `/v1/apps/${app.id}/appStoreVersions?filter[platform]=IOS&limit=5`)
          for (const v of vers.json?.data ?? []) {
            console.log(`Version ${v.attributes.versionString}: state=${v.attributes.appVersionState ?? v.attributes.appStoreState} releaseType=${v.attributes.releaseType} earliestRelease=${v.attributes.earliestReleaseDate}`)
          }

          // ── Availability (v2) ────────────────────────────────────────────
          const avail = dump('appAvailabilityV2', await api('GET', `/v1/apps/${app.id}/appAvailabilityV2`))
          const availId = avail.json?.data?.id
          if (availId) {
            const ta = await api('GET', `/v2/appAvailabilities/${availId}/territoryAvailabilities?limit=200&fields[territoryAvailabilities]=available,contentStatuses,releaseDate,preOrderEnabled,territory&include=territory`)
            const rows = ta.json?.data ?? []
            console.log(`\nterritoryAvailabilities: HTTP ${ta.status}, ${rows.length} rows`)
            const byStatus = {}
            let availableCount = 0
            for (const r of rows) {
              const tid = r.relationships?.territory?.data?.id ?? '?'
              if (r.attributes.available) availableCount++
              const key = `${r.attributes.available ? 'available' : 'NOT available'} / ${(r.attributes.contentStatuses ?? []).join(',') || 'none'}`
              byStatus[key] = (byStatus[key] ?? 0) + 1
              if (['USA', 'CAN', 'GBR'].includes(tid)) console.log(`  ${tid}: ${JSON.stringify(r.attributes)}`)
            }
            console.log(`available in ${availableCount}/${rows.length} territories`)
            console.log('status buckets:', JSON.stringify(byStatus, null, 2))
            if (!ta.ok) dump('territoryAvailabilities error', ta)
          }

          // ── Price schedule ───────────────────────────────────────────────
          const sched = dump('appPriceSchedule', await api('GET', `/v1/apps/${app.id}/appPriceSchedule?include=baseTerritory`))
          const schedId = sched.json?.data?.id
          if (schedId) {
            dump('manualPrices', await api('GET', `/v1/appPriceSchedules/${schedId}/manualPrices?include=appPricePoint,territory&limit=10`), 4000)
            const auto = await api('GET', `/v1/appPriceSchedules/${schedId}/automaticPrices?limit=5`)
            console.log(`automaticPrices: HTTP ${auto.status}, ${(auto.json?.data ?? []).length} rows`)
          }

          console.log('\nRead-only inspection complete. No changes made.')
          EOF
          node /tmp/inspect.mjs
