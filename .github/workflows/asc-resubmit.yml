# TEMP (branch asc6-submit only): PROMOTIONAL TEXT fix on the LIVE 1.0 listing,
# 2026-09-16. The live promo text claimed "compare side-by-side", which the app
# does not do (no A/B compare — see AGENTS.md). Promotional text is the one
# field Apple lets you change on a live version without a new review, so this
# lands immediately. Description / subtitle / screenshots need version 1.0.1
# (separate lane: .github/workflows/app-store-listing.yml).
#
# Same push-driven pattern as the other asc-* TEMP branches: remote sessions
# cannot workflow_dispatch (403), but a push to this branch runs it.

name: App Store Resubmit

on:
  push:
    branches: [asc6-submit]
  workflow_dispatch: {}

concurrency:
  group: asc-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    name: Resubmit to App Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      BUNDLE_ID: com.moodmixformat.mixbase
    steps:
      - name: Replace the live promotional text
        run: |
          cat > /tmp/promo.mjs <<'EOF'
          import crypto from 'node:crypto'

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64, BUNDLE_ID } = process.env
          const BASE = 'https://api.appstoreconnect.apple.com'
          const PROMO = 'Every bounce, mix and master in one place. Track every version, share private links for timestamped feedback, and run your release checklist from rough to release.'
          if (PROMO.length > 170) { console.log(`promo too long: ${PROMO.length}`); process.exit(1) }

          const b64url = (buf) => Buffer.from(buf).toString('base64url')
          function jwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }))
            const now = Math.floor(Date.now() / 1000)
            const payload = b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }))
            const key = Buffer.from(ASC_API_KEY_P8_BASE64, 'base64').toString('utf8')
            const sig = crypto.sign('sha256', Buffer.from(`${header}.${payload}`), { key, dsaEncoding: 'ieee-p1363' })
            return `${header}.${payload}.${b64url(sig)}`
          }
          const TOKEN = jwt()
          async function api(method, path, body) {
            const res = await fetch(`${BASE}${path}`, {
              method,
              headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            })
            const text = await res.text()
            let json = null
            try { json = JSON.parse(text) } catch { /* non-JSON */ }
            return { status: res.status, ok: res.ok, json, text }
          }

          const apps = await api('GET', `/v1/apps?filter[bundleId]=${BUNDLE_ID}`)
          const app = apps.json?.data?.[0]
          if (!app) { console.log('find app FAILED', apps.status, apps.text.slice(0, 500)); process.exit(1) }
          const vers = await api('GET', `/v1/apps/${app.id}/appStoreVersions?filter[platform]=IOS&filter[appVersionState]=READY_FOR_DISTRIBUTION&limit=1`)
          const live = vers.json?.data?.[0]
          if (!live) { console.log('no live iOS version found', vers.status, vers.text.slice(0, 500)); process.exit(1) }
          console.log(`live version ${live.attributes.versionString} (${live.id}) state=${live.attributes.appVersionState}`)
          const locs = await api('GET', `/v1/appStoreVersions/${live.id}/appStoreVersionLocalizations`)
          const loc = (locs.json?.data ?? []).find((l) => l.attributes.locale === 'en-US')
          if (!loc) { console.log('no en-US localization', locs.status, locs.text.slice(0, 500)); process.exit(1) }
          console.log(`before: ${JSON.stringify(loc.attributes.promotionalText)}`)
          if (loc.attributes.promotionalText === PROMO) { console.log('already up to date'); process.exit(0) }
          const patch = await api('PATCH', `/v1/appStoreVersionLocalizations/${loc.id}`, {
            data: { type: 'appStoreVersionLocalizations', id: loc.id, attributes: { promotionalText: PROMO } },
          })
          console.log(`PATCH -> HTTP ${patch.status}`)
          if (!patch.ok) { console.log(patch.text.slice(0, 1500)); process.exit(1) }
          const again = await api('GET', `/v1/appStoreVersionLocalizations/${loc.id}`)
          console.log(`after:  ${JSON.stringify(again.json?.data?.attributes?.promotionalText)}`)
          EOF
          node /tmp/promo.mjs
