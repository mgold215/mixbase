# TEMP (branch asc6-submit only): PROOF + NOTES-ONLY update after the 2.1(b)
# information request of 2026-09-10 (submission 902f9887). No cancel, no
# resubmit — the submission stays open and the reply itself goes through
# App Store Connect's Resolution Center (no API for that). This writes the
# same seven answers into App Review Information so every reviewer who opens
# the app record sees them.
#
# Same push-driven pattern as the other asc-* TEMP branches: remote sessions
# cannot workflow_dispatch (403), but a push to this branch runs it.

name: App Store Resubmit

on:
  push:
    branches: [asc6-submit]
  workflow_dispatch: {}

concurrency:
  group: asc-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    name: Resubmit to App Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      BUNDLE_ID: com.moodmixformat.mixbase
    steps:
      - name: Prove the claim against prod — native (Bearer) is subscription-blind, web (cookie) is not
        env:
          APP_BASE_URL: https://mixbase.app
          PROOF_EMAIL: applereview@mixbase.app
        run: |
          cat > /tmp/proof.mjs <<'EOF3'
          import { createHmac } from 'node:crypto'
          const { APP_BASE_URL, PROOF_EMAIL, ASC_API_KEY_P8_BASE64 } = process.env
          // Same derivation as .github/asc-maintenance/asc-testflight.mjs — the
          // beta-review demo account's password never appears in the repo or logs.
          const b64url = (buf) => Buffer.from(buf).toString('base64').replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_')
          const password = 'Mb1!' + b64url(createHmac('sha256', Buffer.from(ASC_API_KEY_P8_BASE64, 'base64')).update('mixbase-testflight-demo-account-v1').digest()).slice(0, 20)

          const signIn = await fetch(`${APP_BASE_URL}/api/auth`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: PROOF_EMAIL, password }),
          })
          if (signIn.status !== 200) { console.error(`sign-in as proof account failed: HTTP ${signIn.status}`); process.exit(1) }
          const cookies = signIn.headers.getSetCookie?.() ?? []
          const token = cookies.find(c => c.startsWith('sb-access-token='))?.split(';')[0].split('=').slice(1).join('=')
          const cookieHeader = cookies.map(c => c.split(';')[0]).join('; ')
          if (!token) { console.error('no access token cookie'); process.exit(1) }

          const asNative = await (await fetch(`${APP_BASE_URL}/api/subscription`, { headers: { Authorization: `Bearer ${token}` } })).json()
          const asWeb = await (await fetch(`${APP_BASE_URL}/api/subscription`, { headers: { Cookie: cookieHeader } })).json()
          console.log('native (Bearer) view:', JSON.stringify({ tier: asNative.tier, limits: asNative.limits, hasStripeSubscription: asNative.hasStripeSubscription }))
          console.log('web (cookie) view:   ', JSON.stringify({ tier: asWeb.tier, limits: asWeb.limits }))

          let failed = 0
          const check = (name, ok) => { console.log(`${ok ? 'ok ' : 'FAIL'}: ${name}`); if (!ok) failed++ }
          check('web view sees the account\'s real tier (studio for this proof)', asWeb.tier === 'studio')
          check('native view reports free regardless', asNative.tier === 'free')
          check('native view reports no subscription', asNative.hasStripeSubscription === false && asNative.source === null)
          check('native limits are the free allowance', asNative.limits?.artworkGenerations === 3 && asNative.limits?.videoGenerations === 0)
          check('web limits are the studio allowance', asWeb.limits?.artworkGenerations === 25 && asWeb.limits?.videoGenerations === 10)
          if (failed) { console.error(`\nPROOF FAILED (${failed})`); process.exit(1) }
          console.log('\nPROOF GREEN: a web subscription is invisible to and unused by the native apps.')
          EOF3
          node /tmp/proof.mjs

      - name: Write the business-model answers into App Review notes
        run: |
          cat > /tmp/notes.mjs <<'EOF2'
          import crypto from 'node:crypto'

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64, BUNDLE_ID } = process.env
          const BASE = 'https://api.appstoreconnect.apple.com/v1'
          const b64url = (buf) => Buffer.from(buf).toString('base64url')
          function jwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }))
            const now = Math.floor(Date.now() / 1000)
            const payload = b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }))
            const key = Buffer.from(ASC_API_KEY_P8_BASE64, 'base64').toString('utf8')
            const sig = crypto.sign('sha256', Buffer.from(`${header}.${payload}`), { key, dsaEncoding: 'ieee-p1363' })
            return `${header}.${payload}.${b64url(sig)}`
          }
          const TOKEN = jwt()
          async function api(method, path, body) {
            const res = await fetch(`${BASE}${path}`, {
              method,
              headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            })
            const text = await res.text()
            let json = null
            try { json = JSON.parse(text) } catch { /* non-JSON */ }
            return { status: res.status, ok: res.ok, json, text }
          }
          function must(r, what) {
            if (!r.ok) { console.error(`FAILED: ${what} -> HTTP ${r.status}`); console.error(JSON.stringify(r.json ?? r.text, null, 2)); process.exit(1) }
            return r.json
          }

          const apps = must(await api('GET', `/apps?filter[bundleId]=${BUNDLE_ID}`), 'find app')
          const app = apps.data?.[0]
          if (!app) { console.error('No app'); process.exit(1) }
          const vers = must(await api('GET', `/apps/${app.id}/appStoreVersions?filter[platform]=IOS&limit=10`), 'list versions')
          const version = (vers.data ?? []).sort((a, b) => new Date(b.attributes.createdDate) - new Date(a.attributes.createdDate))[0]
          if (!version) { console.error('No version'); process.exit(1) }
          console.log(`Version ${version.attributes.versionString}: state=${version.attributes.appVersionState ?? version.attributes.appStoreState}`)
          const rd = must(await api('GET', `/appStoreVersions/${version.id}/appStoreReviewDetail`), 'read review detail')

          const NOTES = [
            'mixBase is a music production tool for managing mix versions and releases.',
            '',
            'Getting started: sign in with the demo account (see App Review credentials). It is a standard free account, pre-loaded with 3 released tracks with cover art and playable audio.',
            '',
            'BUSINESS MODEL — answers to the September 10 Guideline 2.1(b) questions:',
            '1. Who uses paid content, subscriptions, features, or services in the app? No one. The app contains no paid content, subscriptions, features, or services; every user gets the same app with the same features.',
            '2. Where can users purchase content/subscriptions/features accessed in the app? Nothing accessible in the app is sold anywhere. mixBase also operates a separate browser-based web product at mixbase.app with its own optional subscription; that subscription is used only on the website and is not accessible in, referenced by, or honored by the app.',
            '3. What previously purchased content, subscriptions, features, or services can a user access in the app? None. A user who bought a website subscription gets exactly the same app as a user who did not.',
            '4. What paid content, subscriptions, or features are unlocked within the app without In-App Purchase? None.',
            '5. Physical goods bundled with digital content? No. We sell no physical goods.',
            '6. Can users buy a paid digital subscription on mixbase.app and use it in the app? No. The website subscription applies only to the website in a browser. The app does not read or honor subscription status: every account, free or subscribed on the web, receives identical features and an identical monthly AI-artwork allowance in the app. The app never displays plans, prices, or subscription status, and never links to the website.',
            '7. What does the website subscription contain? It is a web-only plan for the browser product: a higher monthly allowance of AI cover-artwork generations and access to a cloud AI video-generation feature, both used on the website. Neither applies inside the app: the app grants every account the same artwork allowance a free web account gets, and its video visualizers use a free built-in renderer that has no paid tier anywhere.',
            '',
            'Guideline 3.1.1: the app sells nothing and contains no purchase flows, no upgrade prompts, no plan names, no pricing, no In-App Purchases, and no links to external purchase pages. The Privacy Policy, Terms of Service, and Support pages are rendered natively inside the app; no screen opens our website.',
            '',
            'Community feed (user-generated content, Guideline 1.2): long-press any feed track or comment to Report it or Block its author. Reported content is hidden for the reporter immediately, reviewed within 24 hours, and removed for everyone past a report threshold. Our Terms of Service prohibit objectionable content.',
            '',
            'Account deletion (Guideline 5.1.1(v)): Settings tab -> Delete Account (type DELETE to confirm) permanently deletes the account and all data. Test with a throwaway account via "Create one" on the sign-in screen.',
            '',
            'Permissions: Photos read access is requested only when uploading artwork from the photo library; add-only Photos access is requested only when saving a generated visualizer video to Photos.',
            '',
            'The app requires an internet connection.',
          ].join('\n')

          const patched = must(await api('PATCH', `/appStoreReviewDetails/${rd.data.id}`, {
            data: { type: 'appStoreReviewDetails', id: rd.data.id, attributes: { notes: NOTES } },
          }), 'update review notes')
          console.log(`NOTES UPDATED (${NOTES.length} chars) on review detail ${patched.data.id}. No submission changes made.`)
          EOF2
          node /tmp/notes.mjs
