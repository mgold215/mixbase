# TEMP (branch asc6-submit only): NOTES-ONLY update after the 2.1(b)
# information request of 2026-09-10 (submission 902f9887). No cancel, no
# resubmit — the submission stays open and the reply itself goes through
# App Store Connect's Resolution Center (no API for that). This writes the
# same seven answers into App Review Information so every reviewer who opens
# the app record sees them.
#
# Same push-driven pattern as the other asc-* TEMP branches: remote sessions
# cannot workflow_dispatch (403), but a push to this branch runs it.

name: App Store Resubmit

on:
  push:
    branches: [asc6-submit]
  workflow_dispatch: {}

concurrency:
  group: asc-resubmit
  cancel-in-progress: false

jobs:
  resubmit:
    name: Resubmit to App Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      BUNDLE_ID: com.moodmixformat.mixbase
    steps:
      - name: Write the business-model answers into App Review notes
        run: |
          cat > /tmp/notes.mjs <<'EOF2'
          import crypto from 'node:crypto'

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64, BUNDLE_ID } = process.env
          const BASE = 'https://api.appstoreconnect.apple.com/v1'
          const b64url = (buf) => Buffer.from(buf).toString('base64url')
          function jwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }))
            const now = Math.floor(Date.now() / 1000)
            const payload = b64url(JSON.stringify({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }))
            const key = Buffer.from(ASC_API_KEY_P8_BASE64, 'base64').toString('utf8')
            const sig = crypto.sign('sha256', Buffer.from(`${header}.${payload}`), { key, dsaEncoding: 'ieee-p1363' })
            return `${header}.${payload}.${b64url(sig)}`
          }
          const TOKEN = jwt()
          async function api(method, path, body) {
            const res = await fetch(`${BASE}${path}`, {
              method,
              headers: { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            })
            const text = await res.text()
            let json = null
            try { json = JSON.parse(text) } catch { /* non-JSON */ }
            return { status: res.status, ok: res.ok, json, text }
          }
          function must(r, what) {
            if (!r.ok) { console.error(`FAILED: ${what} -> HTTP ${r.status}`); console.error(JSON.stringify(r.json ?? r.text, null, 2)); process.exit(1) }
            return r.json
          }

          const apps = must(await api('GET', `/apps?filter[bundleId]=${BUNDLE_ID}`), 'find app')
          const app = apps.data?.[0]
          if (!app) { console.error('No app'); process.exit(1) }
          const vers = must(await api('GET', `/apps/${app.id}/appStoreVersions?filter[platform]=IOS&limit=10`), 'list versions')
          const version = (vers.data ?? []).sort((a, b) => new Date(b.attributes.createdDate) - new Date(a.attributes.createdDate))[0]
          if (!version) { console.error('No version'); process.exit(1) }
          console.log(`Version ${version.attributes.versionString}: state=${version.attributes.appVersionState ?? version.attributes.appStoreState}`)
          const rd = must(await api('GET', `/appStoreVersions/${version.id}/appStoreReviewDetail`), 'read review detail')

          const NOTES = [
            'mixBase is a music production tool for managing mix versions and releases. It is free: there are no paid plans, subscriptions, or purchases anywhere - not in the app and not on our website.',
            '',
            'Getting started: sign in with the demo account (see App Review credentials). It is a standard account, pre-loaded with 3 released tracks with cover art and playable audio.',
            '',
            'BUSINESS MODEL - answers to the September 10 Guideline 2.1(b) questions:',
            '1. Who uses paid content, subscriptions, features, or services in the app? No one. There are none. Every user gets the same app with the same features.',
            '2. Where can users purchase content, subscriptions, features, or services accessed in the app? Nowhere. mixBase sells nothing, in the app or on mixbase.app. The website previously offered an optional subscription; it has been removed entirely and no purchase of any kind is offered anywhere.',
            '3. What previously purchased content, subscriptions, features, or services can a user access in the app? None. Nothing has ever been purchasable in the app, and nothing purchased elsewhere applies to it.',
            '4. What paid content, subscriptions, or features are unlocked within the app without In-App Purchase? None.',
            '5. Physical goods bundled with digital content? No. We sell no physical goods.',
            '6. Can users buy a paid digital subscription on mixbase.app and use it in the app? No. There is no subscription on mixbase.app any more - the website is free, exactly like the app.',
            '7. What are the contents and features of the paid digital subscription on mixbase.app? There is none. The website has no paid subscription, plan, or purchase. All features - uploads, playback, sharing, the community feed, the release pipeline, AI cover artwork (a monthly allowance identical for every account), and video visualizers (a free built-in renderer) - are free for every account on every platform. If we ever charge for anything in the app in the future, it will be offered only through Apple In-App Purchase.',
            '',
            'Guideline 3.1.1: the app contains no purchase flows, no upgrade prompts, no plan names, no pricing, no In-App Purchases, and no links to external purchase pages. The Privacy Policy, Terms of Service, and Support pages are rendered natively inside the app; no screen opens our website.',
            '',
            'Community feed (user-generated content, Guideline 1.2): long-press any feed track or comment to Report it or Block its author. Reported content is hidden for the reporter immediately, reviewed within 24 hours, and removed for everyone past a report threshold. Our Terms of Service prohibit objectionable content.',
            '',
            'Account deletion (Guideline 5.1.1(v)): Settings tab -> Delete Account (type DELETE to confirm) permanently deletes the account and all data. Test with a throwaway account via "Create one" on the sign-in screen.',
            '',
            'Permissions: Photos read access is requested only when uploading artwork from the photo library; add-only Photos access is requested only when saving a generated visualizer video to Photos.',
            '',
            'The app requires an internet connection.',
          ].join('\n')

          const patched = must(await api('PATCH', `/appStoreReviewDetails/${rd.data.id}`, {
            data: { type: 'appStoreReviewDetails', id: rd.data.id, attributes: { notes: NOTES } },
          }), 'update review notes')
          console.log(`NOTES UPDATED (${NOTES.length} chars) on review detail ${patched.data.id}. No submission changes made.`)
          EOF2
          node /tmp/notes.mjs
