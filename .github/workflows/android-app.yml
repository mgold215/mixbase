# Android build validation — the compile gate for the Kotlin/Compose app.
#
# The remote Claude sandbox cannot reach the Android SDK repository
# (dl.google.com is blocked), so only the :core JVM module can be compiled
# and unit-tested there. This workflow is where the :app module actually
# compiles: it runs the :core tests, assembles a debug APK and uploads it as
# a downloadable artifact (install with `adb install mixBase-debug.apk`).
#
# Runs on PRs into main and pushes to main, but only when Android-side paths
# change — web-only work never spends these minutes.

name: Android App

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches ~/.gradle (dependencies + wrapper) between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (pure Kotlin — same suite the sandbox runs)
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mixBase-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports
          if-no-files-found: ignore
          retention-days: 7
