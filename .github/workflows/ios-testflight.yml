# iOS → TestFlight, no Mac required.
#
# Every merged ios/ change is archived on a GitHub-hosted macOS runner with
# cloud-managed signing (App Store Connect API key — no certs or profiles
# stored in the repo) and uploaded straight to TestFlight. With TestFlight's
# automatic updates on, the iPhone installs each build by itself.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID              App Store Connect API key ID
#   ASC_ISSUER_ID           App Store Connect issuer ID
#   ASC_API_KEY_P8_BASE64   base64 of the .p8 key file (base64 -i AuthKey_XXX.p8)
#
# Note: macOS runners bill minutes at 10x on private repos — the ios/** paths
# filter keeps web-only merges from spending them.

name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch: {}

# Pinned explicitly rather than inherited. The repo default is currently "read",
# so this changes nothing today — but this job holds an App Store Connect
# signing key, and flipping one repo-wide setting to "Read and write" would
# silently hand repo-write to the token sitting next to that key. Declaring it
# here means that setting can never reach this workflow.
permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # Apple requires the iOS 26 SDK (Xcode 26+) for all App Store Connect
      # uploads; the runner's default is still Xcode 16.4, which fails
      # validation with "SDK version issue". Pick the newest installed Xcode.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No versioned Xcode found"; exit 1; fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        run: |
          # UTC-timestamp build number: always increasing, never collides with
          # the build numbers already shipped from Xcode by hand.
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Build number: $BUILD_NUMBER"
          xcodebuild \
            -project ios/mixBase.xcodeproj \
            -scheme mixBase \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/mixBase.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>AP8UC39D4D</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/mixBase.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
