# iOS → TestFlight, no Mac required.
#
# Every merged ios/ change is archived on a GitHub-hosted macOS runner with
# cloud-managed signing (App Store Connect API key — no certs or profiles
# stored in the repo) and uploaded straight to TestFlight. With TestFlight's
# automatic updates on, the iPhone installs each build by itself.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID              App Store Connect API key ID
#   ASC_ISSUER_ID           App Store Connect issuer ID
#   ASC_API_KEY_P8_BASE64   base64 of the .p8 key file (base64 -i AuthKey_XXX.p8)
#
# Note: macOS runners bill minutes at 10x on private repos — the ios/** paths
# filter keeps web-only merges from spending them.
#
# Known failure mode (first hit: run #15, 2026-08-29): the archive dies in
# seconds at GatherProvisioningInputs with "Your account has reached the
# maximum number of certificates" + "No profiles for 'com.moodmixformat.
# mixbase' were found". Each run signs on a fresh runner and the minted
# 'Created via API' development certs pile up until Apple's cap. Fix: the
# "ASC Certificate Audit" workflow (.github/workflows/asc-cert-audit.yml) —
# edit .github/asc-maintenance/request.json to list, then revoke the stale
# runner-minted DEVELOPMENT certs (never the Mac's own, never Distribution);
# {"action": "prune"} runs the cron's keep-newest-4 cleanup on demand. Since
# the ad-hoc-archive change below, this lane mints no development certs at
# all — only local Mac builds still add to that pool.
#
# Second failure mode — RESOLVED by the current architecture (runs #24-28,
# 2026-09-05): once the widget extension made GatherProvisioningInputs fetch
# development profiles for TWO targets, it started dying with "Authentication
# failed: Make sure a bearer token was provided..." on most runs (clock sync,
# serial target builds and in-run retries did not cure it; export-time cloud
# signing never failed once). New identifiers/capabilities also cannot be
# registered from the runners — the "ASC Provisioning" lane
# (.github/asc-maintenance/asc-provisioning.mjs, push-driven, public ASC API)
# does that instead. So the archive below now signs AD-HOC with no App Store
# Connect contact at all, and the export step performs the single
# cloud-managed re-sign — the same pattern macos-testflight.yml has used from
# its first shipped build. If "Authentication failed" ever reappears it can
# only come from the EXPORT step; treat that as ASC-side trouble or a broken
# key, not this workflow.

name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch: {}

# Pinned explicitly rather than inherited. The repo default is currently "read",
# so this changes nothing today — but this job holds an App Store Connect
# signing key, and flipping one repo-wide setting to "Read and write" would
# silently hand repo-write to the token sitting next to that key. Declaring it
# here means that setting can never reach this workflow.
permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # Apple requires the iOS 26 SDK (Xcode 26+) for all App Store Connect
      # uploads; the runner's default is still Xcode 16.4, which fails
      # validation with "SDK version issue". Pick the newest installed Xcode.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No versioned Xcode found"; exit 1; fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Runner clock skew makes the ES256 JWTs Xcode mints for App Store
      # Connect invalid ("Authentication failed: ... bearer token ...", the
      # second failure mode above) — force an NTP sync so the token's
      # timestamps are honest before cloud signing starts.
      - name: Sync system clock
        run: |
          sudo sntp -sS time.apple.com || sudo sntp -sS pool.ntp.org || true
          date -u

      - name: Archive
        run: |
          # UTC-timestamp build number: always increasing, never collides with
          # the build numbers already shipped from Xcode by hand.
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Build number: $BUILD_NUMBER"
          # The archive signs AD-HOC (manual style, identity "-") and never
          # contacts App Store Connect: the two-target development-profile
          # gather failed intermittent Apple auth on most runs after the
          # widget extension was added (header, second failure mode), while
          # export-time cloud signing has never failed. The ad-hoc signature
          # still embeds each target's entitlements — which is what the
          # export step needs: it re-signs app + appex with a cloud-managed
          # Apple Distribution cert and App Store profiles, exactly like the
          # macOS lane. Bonus: no runner development certs at all, so the
          # certificate-cap failure mode disappears for this lane.
          xcodebuild \
            -project ios/mixBase.xcodeproj \
            -scheme mixBase \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/mixBase.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            archive

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>AP8UC39D4D</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/mixBase.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
