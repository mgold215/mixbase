# XcodeGen spec for the mixBASE macOS apps:
#
#   mixBase       — the consumer app (projects, player, artwork, pipeline,
#                   feed). Shares its entire Swift source tree with the native
#                   iOS app (../ios/mixBase); macOS-only shims and resources
#                   live in MixbaseApp/.
#   MixbaseInfra  — the admin infra control panel.
#
# Why XcodeGen: this project is authored in a Linux environment that cannot open
# or validate Xcode. A hand-written .pbxproj risks shipping an un-openable
# project; instead we commit this small, human-readable YAML and generate a
# guaranteed-valid .xcodeproj on the Mac at build time (see build.sh).
#
#   brew install xcodegen             # one-time
#   cd macos && ./build.sh            # generate + build the infra panel
#   cd macos && ./build.sh run mixBase  # generate + build + launch the mixBase app

name: Mixbase
options:
  bundleIdPrefix: com.moodmixformat.mixbase
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: AP8UC39D4D
    CODE_SIGN_STYLE: Automatic

targets:
  # The consumer mixBASE app, sharing the iOS app's sources. Anything
  # platform-specific in that tree is already behind #if os(iOS)/#if os(macOS)
  # guards; the SwiftUI-modifier gaps (keyboardType, navigation bar modifiers,
  # UIPasteboard, …) are bridged by MixbaseApp/PlatformCompat.swift, which is
  # compiled ONLY into this target.
  mixBase:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # The iOS asset catalog, Info.plist, entitlements and privacy manifest
      # are iOS-shaped — this target carries its own under MixbaseApp/.
      - path: ../ios/mixBase
        excludes:
          - "Info.plist"
          - "mixBase.entitlements"
          - "PrivacyInfo.xcprivacy"
          - "Assets.xcassets"
      - path: MixbaseApp
    # Generated (not committed — see .gitignore) so the plist can carry keys
    # the INFOPLIST_KEY_ mechanism doesn't cover; ITSAppUsesNonExemptEncryption
    # keeps TestFlight builds out of "Missing Compliance" limbo, same as iOS.
    info:
      path: MixbaseApp/Info.plist
      properties:
        CFBundleDisplayName: mixBase
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_NAME: mixBase
        # SAME bundle id as the iOS app — deliberately. Apple's universal-app
        # pattern: the Mac build attaches to the existing "mixBASE" App Store
        # Connect record, shows up as a macOS tab in the same TestFlight app,
        # and Sign in with Apple issues tokens with the audience Supabase
        # already authorizes for iOS. Automatic cloud signing provisions the
        # one App ID for both platforms.
        PRODUCT_BUNDLE_IDENTIFIER: com.moodmixformat.mixbase
        CODE_SIGN_ENTITLEMENTS: MixbaseApp/mixBase.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MixbaseInfra:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MixbaseInfra
    settings:
      base:
        PRODUCT_NAME: MixbaseInfra
        PRODUCT_BUNDLE_IDENTIFIER: com.moodmixformat.mixbase.infra
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: MixbaseInfra/MixbaseInfra.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: mixBase Infra
        # macOS app, not a document-based app:
        INFOPLIST_KEY_NSMainStoryboardFile: ""
