# XcodeGen spec for the App Store screenshot tour — a UI-test bundle with NO
# host application. The workflow (.github/workflows/app-store-listing.yml)
# builds the real app from ios/mixBase.xcodeproj, installs it on a simulator,
# and this bundle drives it by bundle id (XCUIApplication(bundleIdentifier:)).
#
# Why a separate, generated project: the shipping .pbxproj has no test target,
# and hand-editing it from a Linux session risks an unopenable project. Same
# reasoning as macos/project.yml — generate a valid project on the runner:
#
#   brew install xcodegen
#   cd ios/screenshots && xcodegen generate
#   xcodebuild test -project ScreenshotTour.xcodeproj -scheme ScreenshotTour \
#     -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
#     CODE_SIGNING_ALLOWED=NO
#
# The tour reads TEST_RUNNER_MIXBASE_EMAIL / _PASSWORD / _SCREENSHOT_DIR from
# the environment (xcodebuild forwards TEST_RUNNER_* to the test process).

name: ScreenshotTour
options:
  bundleIdPrefix: com.moodmixformat.mixbase
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  ScreenshotTour:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScreenshotTour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodmixformat.mixbase.screenshottour
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  ScreenshotTour:
    build:
      targets:
        ScreenshotTour: [test]
    test:
      config: Debug
      targets:
        - ScreenshotTour
